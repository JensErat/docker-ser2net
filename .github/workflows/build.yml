name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jenserat/ser2net
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract ser2net version and push immutable tag
        env:
          IMAGE: ghcr.io/jenserat/ser2net@${{ steps.build.outputs.digest }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          BUILD_DATE=$(date -u +%Y%m%dT%H%M%SZ)
          SHORT_SHA=${SHORT_SHA::7}

          docker pull "$IMAGE"
          PKG_VER=$(docker run --rm --entrypoint dpkg-query "$IMAGE" -W -f='${Version}' ser2net 2>/dev/null || docker run --rm "$IMAGE" sh -c "dpkg-query -W -f='\${Version}' ser2net")
          echo "Full package version: $PKG_VER"

          PKG_VER_NO_EPOCH=$(echo "$PKG_VER" | sed -E 's/^[0-9]+://')
          UPSTREAM=$(echo "$PKG_VER_NO_EPOCH" | sed -E 's/-[^-]+$//')
          DEBREV=$(echo "$PKG_VER_NO_EPOCH" | sed -E 's/.*-//')

          IMMUTABLE_TAG="${UPSTREAM}+pkg.${DEBREV}.${BUILD_DATE}.${SHORT_SHA}"
          echo "Pushing immutable tag: $IMMUTABLE_TAG"
          docker tag "$IMAGE" "ghcr.io/jenserat/ser2net:${IMMUTABLE_TAG}"
          docker push "ghcr.io/jenserat/ser2net:${IMMUTABLE_TAG}"
