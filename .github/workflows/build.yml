name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jenserat/ser2net
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }},ghcr.io/jenserat/ser2net:ci-test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run e2e test
        run: python3 test/e2e.py ghcr.io/jenserat/ser2net:ci-test

      - name: Push tags
        if: github.event_name != 'pull_request'
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            [ -z "$tag" ] && continue
            docker tag ghcr.io/jenserat/ser2net:ci-test "$tag"
            docker push "$tag"
          done

      - name: Extract ser2net version and push version tags
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/jenserat/ser2net@${{ steps.build.outputs.digest }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          BUILD_DATE=$(date -u +%Y%m%dT%H%M%SZ)
          SHORT_SHA=${SHORT_SHA::7}

          docker pull "$IMAGE"
          PKG_VER=$(docker run --rm --entrypoint dpkg-query "$IMAGE" -W -f='${Version}' ser2net 2>/dev/null || docker run --rm "$IMAGE" sh -c "dpkg-query -W -f='\${Version}' ser2net")
          echo "Full package version: $PKG_VER"

          PKG_VER_NO_EPOCH=$(echo "$PKG_VER" | sed -E 's/^[0-9]+://')
          UPSTREAM=$(echo "$PKG_VER_NO_EPOCH" | sed -E 's/-[^-]+$//')
          DEBREV=$(echo "$PKG_VER_NO_EPOCH" | sed -E 's/.*-//')

          echo "Pushing upstream version tag: $UPSTREAM"
          docker tag "$IMAGE" "ghcr.io/jenserat/ser2net:${UPSTREAM}"
          docker push "ghcr.io/jenserat/ser2net:${UPSTREAM}"

          IMMUTABLE_TAG="${UPSTREAM}-pkg.${DEBREV}.${BUILD_DATE}.${SHORT_SHA}"
          echo "Pushing immutable tag: $IMMUTABLE_TAG"
          docker tag "$IMAGE" "ghcr.io/jenserat/ser2net:${IMMUTABLE_TAG}"
          docker push "ghcr.io/jenserat/ser2net:${IMMUTABLE_TAG}"
