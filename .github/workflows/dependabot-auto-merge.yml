name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Detect major base image bump
        id: check
        if: steps.metadata.outputs.package-ecosystem == 'docker'
        run: |
          OLD="${{ steps.metadata.outputs.previous-version }}"
          NEW="${{ steps.metadata.outputs.new-version }}"
          # Fallback to PR title if metadata doesn't expose versions
          if [ -z "$OLD" ] || [ -z "$NEW" ]; then
            TITLE="${{ github.event.pull_request.title }}"
            OLD=$(echo "$TITLE" | grep -oP 'from \K[^ ]+' || true)
            NEW=$(echo "$TITLE" | grep -oP 'to \K[^ ]+' || true)
          fi
          OLD_CODENAME=$(echo "$OLD" | grep -oE 'bookworm|trixie|bullseye|bookworm-slim|trixie-slim|bullseye-slim' | grep -oE 'bookworm|trixie|bullseye' | head -n1 || true)
          NEW_CODENAME=$(echo "$NEW" | grep -oE 'bookworm|trixie|bullseye|bookworm-slim|trixie-slim|bullseye-slim' | grep -oE 'bookworm|trixie|bullseye' | head -n1 || true)
          if [ -n "$OLD_CODENAME" ] && [ -n "$NEW_CODENAME" ] && [ "$OLD_CODENAME" != "$NEW_CODENAME" ]; then
            echo "major=true" >> $GITHUB_OUTPUT
            echo "Major base image bump detected ($OLD_CODENAME -> $NEW_CODENAME), will not auto-merge"
          else
            echo "major=false" >> $GITHUB_OUTPUT
            echo "No major codename change detected, eligible for auto-merge"
          fi

      - name: Enable auto-merge for non-major Docker updates
        if: steps.metadata.outputs.package-ecosystem == 'docker' && steps.check.outputs.major != 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
